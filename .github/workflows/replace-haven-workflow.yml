name: Replace Haven Website with Cenacle Computers

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REPLACE to confirm"
        required: true
        type: string

permissions:
  contents: write

jobs:
  replace-website:
    if: ${{ github.event.inputs.confirm == 'REPLACE' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Cenacle website ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -iname 'Cenacle-Computers-Website*.zip' -print | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Cenacle-Computers-Website ZIP not found."
            echo "Current repository files:"
            find . -maxdepth 2 -type f | sort | head -100
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Cenacle website
        env:
          ZIP: ${{ steps.find_zip.outputs.zip }}
        shell: bash
        run: |
          set -e

          rm -rf /tmp/cenacle
          mkdir -p /tmp/cenacle

          unzip -q "$ZIP" -d /tmp/cenacle

          PROJECT_ROOT="$(find /tmp/cenacle -type f -name package.json -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found inside Cenacle ZIP."
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"

          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='.gitignore'             --exclude='Cenacle-Computers-Website*.zip'             "$PROJECT_ROOT/" ./

      - name: Remove website ZIP
        env:
          ZIP: ${{ steps.find_zip.outputs.zip }}
        run: rm -f "$ZIP"

      - name: Commit replacement
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace Haven website with Cenacle Computers"
          git push origin HEAD:main

      - name: Done
        run: echo "Cenacle Computers website is now in main."
