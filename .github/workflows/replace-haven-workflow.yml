# ==============================
# CENACLE REPO REPLACEMENT
# ==============================

$Zip = "$env:USERPROFILE\Downloads\cenacle-computers-corrected.zip"
$Repo = (Get-Location).Path
$Temp = Join-Path $env:TEMP "cenacle-replacement"

Write-Host ""
Write-Host "=== CENACLE REPO REPLACEMENT ===" -ForegroundColor Cyan
Write-Host ""

# 1. Check ZIP
if (!(Test-Path $Zip)) {
    Write-Host "ERROR: ZIP not found:" -ForegroundColor Red
    Write-Host $Zip
    exit 1
}

# 2. Clean temporary extraction folder
if (Test-Path $Temp) {
    Remove-Item $Temp -Recurse -Force
}

New-Item -ItemType Directory -Path $Temp | Out-Null

# 3. Extract ZIP
Write-Host "[1/6] Extracting corrected ZIP..." -ForegroundColor Yellow
Expand-Archive -Path $Zip -DestinationPath $Temp -Force

# 4. Detect whether ZIP has a single wrapper folder
$items = Get-ChildItem $Temp -Force

if ($items.Count -eq 1 -and $items[0].PSIsContainer) {
    $Source = $items[0].FullName
} else {
    $Source = $Temp
}

Write-Host "Source: $Source" -ForegroundColor DarkGray

# 5. Remove current repo files EXCEPT .git
Write-Host "[2/6] Removing old repository files..." -ForegroundColor Yellow

Get-ChildItem $Repo -Force |
    Where-Object { $_.Name -ne ".git" } |
    Remove-Item -Recurse -Force

# 6. Copy corrected project into repo
Write-Host "[3/6] Copying corrected project..." -ForegroundColor Yellow

Get-ChildItem $Source -Force |
    Copy-Item -Destination $Repo -Recurse -Force

Set-Location $Repo

# 7. Check Git status
Write-Host "[4/6] Checking Git status..." -ForegroundColor Yellow

git status

# 8. Build
Write-Host ""
Write-Host "[5/6] Installing dependencies and building..." -ForegroundColor Yellow

npm install

if ($LASTEXITCODE -ne 0) {
    Write-Host "npm install FAILED." -ForegroundColor Red
    exit 1
}

npm run build

if ($LASTEXITCODE -ne 0) {
    Write-Host "BUILD FAILED. Nothing will be pushed." -ForegroundColor Red
    exit 1
}

# 9. Commit + push
Write-Host ""
Write-Host "[6/6] Committing and pushing replacement..." -ForegroundColor Yellow

git add -A

git commit -m "Replace catalogue with corrected product images"

if ($LASTEXITCODE -ne 0) {
    Write-Host "Commit failed or there were no changes." -ForegroundColor Yellow
}

git push origin HEAD

if ($LASTEXITCODE -ne 0) {
    Write-Host "PUSH FAILED." -ForegroundColor Red
    exit 1
}

# Cleanup
Remove-Item $Temp -Recurse -Force -ErrorAction SilentlyContinue

Write-Host ""
Write-Host "====================================" -ForegroundColor Green
Write-Host " REPOSITORY REPLACED SUCCESSFULLY" -ForegroundColor Green
Write-Host "====================================" -ForegroundColor Green
Write-Host ""
Write-Host "Corrected catalogue has been pushed."
Write-Host ""
